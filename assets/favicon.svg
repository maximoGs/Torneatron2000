<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>
  
  <!-- Chessboard Grid Accents Subtle -->
  <g opacity="0.12">
    <rect x="76" y="76" width="90" height="90" fill="#ffffff" rx="10"/>
    <rect x="256" y="76" width="90" height="90" fill="#ffffff" rx="10"/>
    <rect x="166" y="166" width="90" height="90" fill="#ffffff" rx="10"/>
    <rect x="346" y="166" width="90" height="90" fill="#ffffff" rx="10"/>
    <rect x="76" y="256" width="90" height="90" fill="#ffffff" rx="10"/>
    <rect x="256" y="256" width="90" height="90" fill="#ffffff" rx="10"/>
    <rect x="166" y="346" width="90" height="90" fill="#ffffff" rx="10"/>
    <rect x="346" y="346" width="90" height="90" fill="#ffffff" rx="10"/>
  </g>

  <!-- Trophy Base & Cup (Gold) -->
  <g filter="url(#glow)">
    <!-- Chess Knight + Trophy Silhouette Hybrid -->
    <!-- Crown / Trophy Top -->
    <path d="M156 160 C156 160, 180 280, 256 295 C332 280, 356 160, 356 160 L380 180 C395 240, 350 310, 285 330 L285 380 L330 400 L330 425 L182 425 L182 400 L227 380 L227 330 C162 310, 117 240, 132 180 Z" fill="url(#goldGrad)"/>
    
    <!-- Handles of Trophy -->
    <path d="M152 175 C100 185, 90 265, 145 285 C140 270, 140 250, 144 235 C115 225, 115 195, 150 185 Z" fill="#f59e0b" opacity="0.9"/>
    <path d="M360 175 C412 185, 422 265, 367 285 C372 270, 372 250, 368 235 C397 225, 397 195, 362 185 Z" fill="#f59e0b" opacity="0.9"/>
    
    <!-- Chess Knight Symbol in Center -->
    <path d="M256 140 C242 140, 230 150, 225 165 C220 180, 205 190, 195 192 C190 193, 190 200, 198 202 C210 205, 218 198, 222 215 C225 228, 210 245, 210 245 C225 245, 240 235, 248 222 C255 210, 270 200, 285 210 C290 214, 292 205, 288 200 C280 190, 282 175, 275 160 C270 148, 264 140, 256 140 Z" fill="#0f172a"/>
    
    <!-- Star on Trophy Base -->
    <polygon points="256,345 261,360 277,360 264,370 269,385 256,375 243,385 248,370 235,360 251,360" fill="#ffffff" opacity="0.95"/>
  </g>
  
  <!-- Modern Glow Badge Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.4" stroke-dasharray="16 12"/>
</svg>
